name: 🚀 Deploy
on:
  push:
    branches:
      - main
      - dev

  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  packages: write

env:
  HUSKY: 0
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # Force npm to resolve linux-x64 optional native bindings even when lockfile
  # was generated on macOS. Fixes @libsql/linux-x64-gnu and similar missing modules.
  npm_config_os: linux
  npm_config_cpu: x64
  npm_config_libc: glibc

jobs:
  affected:
    name: 📊 Detect Affected Projects
    runs-on: ubuntu-22.04
    outputs:
      app: ${{ steps.affected.outputs.app }}
      admin: ${{ steps.affected.outputs.admin }}
      web: ${{ steps.affected.outputs.web }}
      sites: ${{ steps.affected.outputs.sites }}
      tenant_api: ${{ steps.affected.outputs.tenant_api }}
      jobs_cron: ${{ steps.affected.outputs.jobs_cron }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 📊 Check affected projects
        id: affected
        run: |
          # Get the base ref for comparison
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          else
            BASE_REF="HEAD~1"
          fi

          # Check which projects are affected
          echo "app=$(npx turbo ls --filter="...[$BASE_REF]" | grep -qE '^\s*app\s+' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "admin=$(npx turbo ls --filter="...[$BASE_REF]" | grep -qE '^\s*admin\s+' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "web=$(npx turbo ls --filter="...[$BASE_REF]" | grep -qE '^\s*web\s+' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "sites=$(npx turbo ls --filter="...[$BASE_REF]" | grep -qE '^\s*sites\s+' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "tenant_api=$(npx turbo ls --filter="...[$BASE_REF]" | grep -qE '^\s*tenant-api\s+' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "jobs_cron=$(npx turbo ls --filter="...[$BASE_REF]" | grep -qE '^\s*jobs-cron\s+' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
  lint:
    name: 🔬 Lint
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp libsql rolldown @astrojs/compiler-binding

      - name: 🛠 Setup Database
        run: npm run db:migrate:deploy && npm run db:generate

      - name: ⚡ Lint (Oxc - Fast)
        run: npm run lint:oxc

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp libsql rolldown @astrojs/compiler-binding

      - name: 🛠 Setup Database
        run: npm run db:migrate:deploy && npm run db:generate

      - name: 🏗 Build
        run: npm run build

      - name: 🔎 Type check
        run: npm run typecheck --if-present

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp libsql rolldown @astrojs/compiler-binding

      - name: 🛠 Setup Database
        run: npm run db:migrate:deploy && npm run db:generate

      - name: ⚡ Run vitest
        run: npm run test -- -- --coverage

  playwright:
    name: 🎭 Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp libsql rolldown @astrojs/compiler-binding

      - name: 📥 Install Playwright Browsers
        run: npm run test:e2e:install

      - name: 🛠 Setup Database
        run: |
          npm run db:migrate:deploy && npm run db:generate && npm run db:seed

      - name: 🏗 Build
        run: npm run build

      - name: 🎭 Playwright tests
        run: npm run test:e2e:run

      - name: 📊 Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: apps/app/playwright-report/
          retention-days: 30

  deploy-web:
    name: 🌐 Deploy Web App
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, affected]
    # only deploy web app on pushes to main/dev AND if web app was affected
    if:
      ${{ github.event_name == 'push' && needs.affected.outputs.web == 'true' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp libsql rolldown @astrojs/compiler-binding

      - name: 🏗 Build Web App
        run: npx turbo run build --filter=web

      - name: 🚀 Deploy Web App to Cloudflare Workers
        working-directory: apps/web
        run:
          npx wrangler deploy ${{ github.ref == 'refs/heads/dev' && '--env
          staging' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-sites:
    name: 🌐 Deploy Sites
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, affected]
    if:
      ${{ github.event_name == 'push' && needs.affected.outputs.sites == 'true'
      }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🏗 Build Sites
        run: npx turbo run build --filter=sites
        env:
          PUBLIC_APP_URL:
            ${{ vars.PUBLIC_APP_URL || 'https://epic-startup.me' }}
          TENANT_API_URL:
            ${{ vars.TENANT_API_URL || 'https://tenant-us.example.com' }}
          TENANT_API_URL_KSA:
            ${{ vars.TENANT_API_URL_KSA || 'https://tenant-ksa.example.com' }}

      - name: 🚀 Deploy Sites to Cloudflare Workers
        working-directory: apps/sites
        run:
          npx wrangler deploy ${{ github.ref == 'refs/heads/dev' && '--env
          staging' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # CMS is deployed to Cloudflare Workers (no container needed)

  container-tenant-api:
    name: 📦 Build Tenant API Image
    runs-on: ubuntu-24.04
    needs: [affected]
    if:
      ${{ github.event_name == 'push' && needs.affected.outputs.tenant_api ==
      'true' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: 🏷️ Image name
        id: meta
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}/tenant-api" >> "$GITHUB_OUTPUT"

      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Build and push linux/arm64 (OCI Ampere)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/tenant-api/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}

  deploy-app:
    name: 🚀 Deploy / validate App (Cloudflare Workers)
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, playwright, affected]
    if:
      ${{ needs.affected.outputs.app == 'true' && (github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')) }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🏗 Build App
        run:
          NODE_OPTIONS=--max-old-space-size=6144 DEPLOY_TARGET=cloudflare npx
          turbo run build --filter=app

      - name: 🔎 Validate App deployment
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: apps/app
        run: npx wrangler deploy --dry-run

      - name: 🚀 Deploy App
        if: ${{ github.event_name == 'push' }}
        working-directory: apps/app
        run:
          npx wrangler deploy ${{ github.ref == 'refs/heads/dev' && '--env
          staging' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-admin:
    name: 🚀 Deploy / validate Admin (Cloudflare Workers)
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, playwright, affected]
    if:
      ${{ needs.affected.outputs.admin == 'true' && (github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')) }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🏗 Build Admin
        run:
          NODE_OPTIONS=--max-old-space-size=6144 DEPLOY_TARGET=cloudflare npx
          turbo run build --filter=admin

      - name: 🔎 Validate Admin deployment
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: apps/admin
        run: npx wrangler deploy --dry-run

      - name: 🚀 Deploy Admin
        if: ${{ github.event_name == 'push' }}
        working-directory: apps/admin
        run:
          npx wrangler deploy ${{ github.ref == 'refs/heads/dev' && '--env
          staging' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-jobs-cron:
    name: 🚀 Deploy Jobs Cron (Cloudflare Workers)
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, affected]
    if:
      ${{ github.event_name == 'push' && (needs.affected.outputs.jobs_cron ==
      'true' || contains(github.event.head_commit.modified, 'apps/jobs-cron/'))
      }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🚀 Deploy jobs-cron Worker
        working-directory: apps/jobs-cron
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-tenant-api-us-cf:
    name: 🚀 Deploy Tenant API US (Cloudflare)
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, container-tenant-api, affected]
    if:
      ${{ github.event_name == 'push' && needs.affected.outputs.tenant_api ==
      'true' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🚀 Deploy US tenant-api (Cloudflare Workers + DO SQLite)
        working-directory: apps/tenant-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:cf

      - name: 🩺 Health check US (Cloudflare)
        if: ${{ vars.TENANT_API_URL != '' }}
        env:
          TENANT_API_URL: ${{ vars.TENANT_API_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS "${TENANT_API_URL}/health" || true)"
            if echo "$body" | grep -q '"region":"us"'; then
              echo "US tenant-api healthy on Cloudflare"
              exit 0
            fi
            echo "Attempt ${attempt}/5: waiting for US tenant-api..."
            sleep 30
          done
          echo "US tenant-api health check failed"
          exit 1

  deploy-tenant-api-oci:
    name: 🚀 Deploy Tenant API (OCI)
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, container-tenant-api, affected]
    if:
      ${{ github.event_name == 'push' && needs.affected.outputs.tenant_api ==
      'true' }}
    steps:
      - name: 🚀 Deploy US (Ashburn, optional OCI fallback)
        if: ${{ vars.OCI_TENANT_US_HOST != '' }}
        env:
          HOST: ${{ vars.OCI_TENANT_US_HOST }}
          SSH_USER: ${{ vars.OCI_TENANT_SSH_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.OCI_TENANT_SSH_KEY }}
          IMAGE:
            ${{ needs.container-tenant-api.outputs.image }}:${{ github.sha }}
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/oci_key
          printf '%s\n' "$SSH_KEY" > /tmp/oci_key
          ssh -i /tmp/oci_key -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${HOST}" \
            "set -euo pipefail
             echo '${PULL_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin
             cd /opt/tenant-api
             TENANT_API_IMAGE='${IMAGE}' docker compose pull
             TENANT_API_IMAGE='${IMAGE}' docker compose up -d"

      - name: 🚀 Deploy KSA (Riyadh)
        if: ${{ vars.OCI_TENANT_KSA_HOST != '' }}
        env:
          HOST: ${{ vars.OCI_TENANT_KSA_HOST }}
          SSH_USER: ${{ vars.OCI_TENANT_SSH_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.OCI_TENANT_SSH_KEY }}
          IMAGE:
            ${{ needs.container-tenant-api.outputs.image }}:${{ github.sha }}
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/oci_key
          printf '%s\n' "$SSH_KEY" > /tmp/oci_key
          ssh -i /tmp/oci_key -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${HOST}" \
            "set -euo pipefail
             echo '${PULL_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin
             cd /opt/tenant-api
             TENANT_API_IMAGE='${IMAGE}' docker compose pull
             TENANT_API_IMAGE='${IMAGE}' docker compose up -d"

      - name: 🩺 Health check KSA (OCI)
        if: ${{ vars.TENANT_API_URL_KSA != '' }}
        env:
          TENANT_API_URL_KSA: ${{ vars.TENANT_API_URL_KSA }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS "${TENANT_API_URL_KSA}/health" || true)"
            if echo "$body" | grep -q '"region":"ksa"'; then
              echo "KSA tenant-api healthy on OCI"
              exit 0
            fi
            echo "Attempt ${attempt}/5: waiting for KSA tenant-api..."
            sleep 15
          done
          echo "KSA tenant-api health check failed"
          exit 1
