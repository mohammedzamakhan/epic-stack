name: 🚀 Deploy
on:
  push:
    branches:
      - main
      - dev

  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

env:
  HUSKY: 0
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  affected:
    name: 📊 Detect Affected Projects
    runs-on: ubuntu-22.04
    outputs:
      app: ${{ steps.affected.outputs.app }}
      admin: ${{ steps.affected.outputs.admin }}
      web: ${{ steps.affected.outputs.web }}
      cms: ${{ steps.affected.outputs.cms }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 📊 Check affected projects
        id: affected
        run: |
          # Get the base ref for comparison
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          else
            BASE_REF="HEAD~1"
          fi

          # Check which projects are affected
          echo "app=$(npx turbo ls --filter="...[$BASE_REF]" | grep -qE '^\s*app\s+' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "admin=$(npx turbo ls --filter="...[$BASE_REF]" | grep -qE '^\s*admin\s+' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "web=$(npx turbo ls --filter="...[$BASE_REF]" | grep -qE '^\s*web\s+' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "cms=$(npx turbo ls --filter="...[$BASE_REF]" | grep -qE '^\s*cms\s+' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
  lint:
    name: 🔬 Lint
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🛠 Setup Database
        run: npm run db:migrate:deploy && npm run db:generate

      - name: ⚡ Lint (Oxc - Fast)
        run: npm run lint:oxc

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp

      - name: 🔑 Inject CMS DATABASE_URI
        run: echo "DATABASE_URI=mongodb://127.0.0.1:27017/payload-test" >> apps/cms/.env

      - name: 🛠 Setup Database
        run: npm run db:migrate:deploy && npm run db:generate

      - name: 🏗 Build
        run: npm run build

      - name: 🔎 Type check
        run: npm run typecheck --if-present

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp

      - name: 🛠 Setup Database
        run: npm run db:migrate:deploy && npm run db:generate

      - name: ⚡ Run vitest
        run: npm run test -- -- --coverage

  playwright:
    name: 🎭 Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🔑 Inject CMS DATABASE_URI
        run: echo "DATABASE_URI=mongodb://127.0.0.1:27017/payload-test" >> apps/cms/.env

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp

      - name: 📥 Install Playwright Browsers
        run: npm run test:e2e:install

      - name: 🛠 Setup Database
        run: |
          npm run db:migrate:deploy && npm run db:generate && npm run db:seed

      - name: 🏗 Build
        run: npm run build

      - name: 🎭 Playwright tests
        run: npm run test:e2e:run

      - name: 📊 Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: apps/app/playwright-report/
          retention-days: 30

  deploy-web:
    name: 🌐 Deploy Web App
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, affected]
    # only deploy web app on pushes to main/dev AND if web app was affected
    if: ${{ github.event_name == 'push' && needs.affected.outputs.web == 'true' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⎔ Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: 🔧 Rebuild native dependencies
        run: npm rebuild sharp

      - name: 🏗 Build Web App
        run: |
          cd apps/web
          npm run build

      - name: 🚀 Deploy to Cloudflare Pages (Production)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca # v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: epic-startup-web
          directory: apps/web/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Deploy to Cloudflare Pages (Staging)
        if: ${{ github.ref == 'refs/heads/dev' }}
        uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca # v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: epic-startup-web-staging
          directory: apps/web/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  container-app:
    name: 📦 Prepare App Container
    runs-on: ubuntu-24.04
    needs: [affected]
    # only prepare container on pushes AND if app was affected
    if: ${{ github.event_name == 'push' && needs.affected.outputs.app == 'true' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: 👀 Read app name
        uses: SebRollen/toml-action@b1b3628f55fc3a28208d4203ada8b737e9687876 # v1.2.0
        id: app_name
        with:
          file: 'apps/app/fly.toml'
          field: 'app'

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: 📦 Build App Staging Container
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          flyctl deploy \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --config apps/app/fly.toml \
            --dockerfile apps/app/other/Dockerfile \
            --app ${{ steps.app_name.outputs.value }}-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 📦 Build App Production Container
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          flyctl deploy \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-secret SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --config apps/app/fly.toml \
            --dockerfile apps/app/other/Dockerfile \
            --app ${{ steps.app_name.outputs.value }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  container-admin:
    name: 📦 Prepare Admin Container
    runs-on: ubuntu-24.04
    needs: [affected]
    # only prepare container on pushes AND if admin was affected
    if: ${{ github.event_name == 'push' && needs.affected.outputs.admin == 'true' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: 👀 Read admin app name
        uses: SebRollen/toml-action@b1b3628f55fc3a28208d4203ada8b737e9687876 # v1.2.0
        id: admin_app_name
        with:
          file: 'apps/admin/fly.toml'
          field: 'app'

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: 📦 Build Admin Staging Container
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          flyctl deploy \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --config apps/admin/fly.toml \
            --dockerfile apps/admin/other/Dockerfile \
            --app ${{ steps.admin_app_name.outputs.value }}-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 📦 Build Admin Production Container
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          flyctl deploy \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-secret SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --config apps/admin/fly.toml \
            --dockerfile apps/admin/other/Dockerfile \
            --app ${{ steps.admin_app_name.outputs.value }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  container-cms:
    name: 📦 Prepare CMS Container
    runs-on: ubuntu-24.04
    needs: [affected]
    # only prepare container on pushes AND if cms was affected
    if:
      ${{ github.event_name == 'push' && (needs.affected.outputs.app == 'true' || 
      needs.affected.outputs.admin == 'true' || contains(github.event.head_commit.modified, 'apps/cms/')) }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: 👀 Read CMS app name
        uses: SebRollen/toml-action@b1b3628f55fc3a28208d4203ada8b737e9687876 # v1.2.0
        id: cms_app_name
        with:
          file: 'apps/cms/fly.toml'
          field: 'app'

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: 📦 Build CMS Staging Container
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          flyctl deploy \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --config apps/cms/fly.toml \
            --dockerfile apps/cms/Dockerfile \
            --app ${{ steps.cms_app_name.outputs.value }}-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 📦 Build CMS Production Container
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          flyctl deploy \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --config apps/cms/fly.toml \
            --dockerfile apps/cms/Dockerfile \
            --app ${{ steps.cms_app_name.outputs.value }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-app:
    name: 🚀 Deploy App
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, playwright, container-app, affected]
    # only deploy on pushes AND if app was affected
    if: ${{ github.event_name == 'push' && needs.affected.outputs.app == 'true' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: 👀 Read app name
        uses: SebRollen/toml-action@b1b3628f55fc3a28208d4203ada8b737e9687876 # v1.2.0
        id: app_name
        with:
          file: 'apps/app/fly.toml'
          field: 'app'

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: 🚀 Deploy App Staging
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          flyctl deploy \
            --image "registry.fly.io/${{ steps.app_name.outputs.value }}-staging:${{ github.sha }}" \
            --config apps/app/fly.toml \
            --app ${{ steps.app_name.outputs.value }}-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚀 Deploy App Production
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          flyctl deploy \
            --image "registry.fly.io/${{ steps.app_name.outputs.value }}:${{ github.sha }}" \
            --config apps/app/fly.toml \
            --app ${{ steps.app_name.outputs.value }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-admin:
    name: 🚀 Deploy Admin
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, playwright, container-admin, affected]
    # only deploy on pushes AND if admin was affected
    if: ${{ github.event_name == 'push' && needs.affected.outputs.admin == 'true' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: 👀 Read admin app name
        uses: SebRollen/toml-action@b1b3628f55fc3a28208d4203ada8b737e9687876 # v1.2.0
        id: admin_app_name
        with:
          file: 'apps/admin/fly.toml'
          field: 'app'

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: 🚀 Deploy Admin Staging
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          flyctl deploy \
            --image "registry.fly.io/${{ steps.admin_app_name.outputs.value }}-staging:${{ github.sha }}" \
            --config apps/admin/fly.toml \
            --app ${{ steps.admin_app_name.outputs.value }}-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚀 Deploy Admin Production
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          flyctl deploy \
            --image "registry.fly.io/${{ steps.admin_app_name.outputs.value }}:${{ github.sha }}" \
            --config apps/admin/fly.toml \
            --app ${{ steps.admin_app_name.outputs.value }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-cms:
    name: 🚀 Deploy CMS
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, container-cms, affected]
    # only deploy on pushes AND if cms was affected
    if:
      ${{ github.event_name == 'push' && (needs.affected.outputs.app == 'true' || 
      needs.affected.outputs.admin == 'true' || contains(github.event.head_commit.modified, 'apps/cms/')) }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: 👀 Read CMS app name
        uses: SebRollen/toml-action@b1b3628f55fc3a28208d4203ada8b737e9687876 # v1.2.0
        id: cms_app_name
        with:
          file: 'apps/cms/fly.toml'
          field: 'app'

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: 🚀 Deploy CMS Staging
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          flyctl deploy \
            --image "registry.fly.io/${{ steps.cms_app_name.outputs.value }}-staging:${{ github.sha }}" \
            --config apps/cms/fly.toml \
            --app ${{ steps.cms_app_name.outputs.value }}-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚀 Deploy CMS Production
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          flyctl deploy \
            --image "registry.fly.io/${{ steps.cms_app_name.outputs.value }}:${{ github.sha }}" \
            --config apps/cms/fly.toml \
            --app ${{ steps.cms_app_name.outputs.value }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
