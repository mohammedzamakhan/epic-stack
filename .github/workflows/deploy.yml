name: 🚀 Deploy
on:
  push:
    branches:
      - main
      - dev

  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  playwright:
    name: 🎭 Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🏄 Copy test env vars
        run:
          cp apps/cms/.env.example apps/cms/.env

      - name: 🔑 Inject CMS DATABASE_URI
        run: echo "DATABASE_URI=${{ secrets.DATABASE_URI }}" >> apps/cms/.env

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📥 Download deps
        uses: bahmutov/npm-install@v1

      - name: 📥 Install deps
        run: npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --save-optional

      - name: 📥 Install Playwright Browsers
        run: npm run test:e2e:install

      - name: 🛠 Setup Database
        run: |
          npm run db:migrate:deploy && npm run db:generate && npm run db:seed

      - name: 🏗 Build
        run: npm run build

      - name: 🎭 Playwright tests
        run: npm run test:e2e:run
        env:
          JWT_SECRET: test-jwt-secret-for-ci

      - name: 📊 Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/app/playwright-report/
          retention-days: 30
