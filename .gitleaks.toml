title = "Epic Stack Gitleaks Config"

[allowlist]
description = "Allowlist for false positives"

# Ignore documentation files that show examples of what NOT to do
paths = [
  '''apps/docs/security/secure-coding\.mdx''',
  '''docs/security.*\.md''',
  '''docs/environment.*\.md''',
  '''tests/fixtures/.*''',
  '''__mocks__/.*'''
]

# Allow specific dummy/mock secret strings used in automated unit test environment setup
regexes = [
  '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
  '''test-secret-key-for-oauth-state-validation-12345''',
  '''dev-audit-secret-change-in-production'''
]
