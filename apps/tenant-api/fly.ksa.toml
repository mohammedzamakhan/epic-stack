app = "epic-startup-tenant-ksa"
primary_region = "jed"
kill_signal = "SIGINT"
kill_timeout = 5
swap_size_mb = 512

[experimental]
auto_rollback = true

[mounts]
source = "data"
destination = "/data"

[build]
dockerfile = "apps/tenant-api/Dockerfile"
ignorefile = "apps/tenant-api/Dockerfile.dockerignore"

[env]
  DATA_REGION = "ksa"
  PRIMARY_REGION = "jed"
  LITEFS_CONSUL_KEY = "epic-startup-tenant-ksa-db"
  ROOT_APP = "epic-startup.me"

[[services]]
internal_port = 8080
protocol = "tcp"

  [services.concurrency]
  hard_limit = 100
  soft_limit = 80
  type = "requests"

  [[services.ports]]
  handlers = ["http"]
  port = 80
  force_https = true

  [[services.ports]]
  handlers = ["tls", "http"]
  port = 443

  [[services.tcp_checks]]
  grace_period = "1s"
  interval = "15s"
  restart_limit = 0
  timeout = "2s"

  [[services.http_checks]]
  interval = "10s"
  grace_period = "5s"
  method = "get"
  path = "/health"
  protocol = "http"
  timeout = "2s"
  tls_skip_verify = false

  [[services.http_checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/litefs/health"
