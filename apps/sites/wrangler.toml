name = "epic-startup-sites"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "assets_navigation_has_no_effect"]
workers_dev = true

[assets]
binding = "ASSETS"
run_worker_first = ["/*"]
html_handling = "none"
not_found_handling = "none"

[vars]
PUBLIC_APP_URL = "https://epic-startup-app.zama-887.workers.dev"
ROOT_APP = "workers.dev"
PUBLIC_SITE_HOST_SUFFIXES = "workers.dev"

[env.production]
name = "epic-startup-sites"

[env.preview]
name = "epic-startup-sites-preview"

[env.staging]
name = "epic-startup-sites-staging"
